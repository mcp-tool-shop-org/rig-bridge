name: ci

on:
  push:
    paths:
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "src/**"
      - "schemas/**"
      - "docs/**"
      - ".github/workflows/**"
      - "atlas/**"
      - "site/package.json"
      - "site/package-lock.json"
      - "site/astro.config.mjs"
      # Codecov reads its status and comment settings from this file.
      - "codecov.yml"
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "src/**"
      - "schemas/**"
      - "docs/**"
      - ".github/workflows/**"
      - "atlas/**"
      - "site/package.json"
      - "site/package-lock.json"
      - "site/astro.config.mjs"
      # Codecov reads its status and comment settings from this file.
      - "codecov.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # 'true' on a pull request or a push to the default branch, the runs
      # whose coverage and test results go to Codecov.
      COVERAGE_LEG: ${{ github.event_name == 'pull_request' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: "npm"
      - name: Atlas check
        run: npx --yes @dogfood-lab/atlas@1.24.0 check
      - run: npm ci
      - name: Audit dependencies
        # On a push to main: the absolute audit, exactly as before.
        if: github.event_name != 'pull_request'
        # Tightened to `high` 2026-09-07: the TODO that lived here waited on vitest v4
        # to clear a transitive fast-uri HIGH via vitest@2. vitest is on 5.0.0 now and
        # the tree audits clean at every level, so the gate no longer has to sit at
        # `critical` to stay green -- which is the level it was always meant to leave.
        run: npm audit --audit-level=high
      # On a pull request, fail only on advisories THIS PR introduces. The
      # lockfile-wide audit above blocked Dependabot #4 on 2026-09-17 for an
      # advisory it did not touch. Standing debt is printed, not failed.
      - name: Audit dependencies (delta vs base)
        if: github.event_name == 'pull_request'
        uses: mcp-tool-shop-org/.github/.github/actions/delta-audit@f4a52204518a78c45f388d6c70cf7b727a5cc6a6 # v1.0.0
        with:
          level: high
      - run: npm run typecheck
      - run: npm run build
      - name: Built-CLI smoke
        run: |
          BUILT_VERSION=$(node dist/cli.js --version)
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$BUILT_VERSION" != "$PKG_VERSION" ]; then
            echo "Version mismatch: built CLI says $BUILT_VERSION, package.json says $PKG_VERSION"
            exit 1
          fi
          echo "Built CLI smoke OK: $BUILT_VERSION"
      - name: Tests
        id: tests
        run: npm test --if-present -- --coverage.enabled=${{ env.COVERAGE_LEG == 'true' }} --reporter=default --reporter=junit --outputFile.junit=junit.xml 2>&1 | tee test-output.log
      # The codecov job below uploads what these two steps save; this job
      # never holds an OIDC token. Coverage is saved when the tests passed,
      # and test results whenever they ran, failures included, because a
      # failing test is what that report exists to show. A save step with no
      # file to save fails the job. overwrite lets a re-run of this job
      # replace the artifact its earlier attempt saved.
      - name: Save coverage for Codecov
        if: ${{ env.COVERAGE_LEG == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codecov-coverage
          path: coverage/coverage-final.json
          if-no-files-found: error
          retention-days: 3
          overwrite: true
      - name: Save test results for Codecov
        if: ${{ !cancelled() && env.COVERAGE_LEG == 'true' && steps.tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codecov-test-results
          path: junit.xml
          if-no-files-found: error
          retention-days: 3
          overwrite: true
      - name: CI summary
        if: always()
        run: |
          {
            echo "## rig-bridge CI summary"
            echo ""
            if [ -f test-output.log ]; then
              TEST_COUNT=$(grep -oP '\d+(?= passed)' test-output.log | head -1 || echo "n/a")
              echo "- Tests: ${TEST_COUNT} passing"
            else
              echo "- Tests: log not found"
            fi
            AUDIT_JSON=$(npm audit --json 2>/dev/null || echo '{}')
            CRIT=$(echo "$AUDIT_JSON" | jq -r '.metadata.vulnerabilities.critical // 0')
            HIGH=$(echo "$AUDIT_JSON" | jq -r '.metadata.vulnerabilities.high // 0')
            MOD=$(echo "$AUDIT_JSON" | jq -r '.metadata.vulnerabilities.moderate // 0')
            echo "- Audit: ${CRIT} critical / ${HIGH} high / ${MOD} moderate"
            echo "- Node: ${{ matrix.node-version || '22' }}"
            echo "- OS: ${{ runner.os }}"
          } >> $GITHUB_STEP_SUMMARY

  codecov:
    # Uploads what the test job saved, from a job of its own, so the OIDC
    # token that signs in to Codecov never exists beside the install and the
    # tests. The checkout, which keeps no token, is there only so Codecov can
    # match report paths to files: the job installs nothing and runs none of
    # the repository's code. It runs whenever the test job ran, failures
    # included, so failing tests still reach Codecov, and only on the events
    # that collect coverage. A run the concurrency group cancels uploads
    # nothing, and each run reads only its own artifacts.
    needs: build-and-test
    if: ${{ !cancelled() && needs.build-and-test.result != 'cancelled' && needs.build-and-test.result != 'skipped' && (github.event_name == 'pull_request' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Each artifact unpacks where the test job wrote its files. A pattern
      # that matches nothing, unlike a name, does not fail: a failing test
      # run saves test results and no coverage.
      - name: Download coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: codecov-coverage
          path: coverage
      - name: Download test results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: codecov-test-results
          path: .
      # After a passing test job both artifacts exist, so each upload runs,
      # and fails the job if its files are missing; after a failing one each
      # runs when its files arrived. Both sign in with OIDC, fail the job when
      # Codecov refuses the report, and run the Codecov CLI at a fixed version
      # rather than whichever is newest.
      - name: Upload coverage to Codecov
        if: ${{ needs.build-and-test.result == 'success' || hashFiles('coverage/coverage-final.json') != '' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          version: v11.3.1
          use_oidc: true
          fail_ci_if_error: true
          disable_search: true
          files: ./coverage/coverage-final.json
      - name: Upload test results to Codecov
        if: ${{ needs.build-and-test.result == 'success' || hashFiles('junit.xml') != '' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          version: v11.3.1
          use_oidc: true
          fail_ci_if_error: true
          report_type: test_results
          disable_search: true
          files: ./junit.xml
